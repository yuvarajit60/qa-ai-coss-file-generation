variables:
- name: platform
  value: qa
- name: repository
  value: qa-ai-test-data-generator
- name: iacScriptPath
  value: "Terraform"
- name: deployableComponent
  value: application_deploy     # possible values - application_deploy; application_sqlscripts_deploy
- name: applicationType       # possible values - functionapp; webApp; webAppLinux
